# Flags
CompileFlags:
  Add: 
    - -std=c++20
    - -Wall
    - -Wextra

# Inline hints
InlayHints:
  ParameterNames: No
  DeducedTypes: No
  Designators: No

# Diagnostics
Diagnostics:
#   Suppress:
#     - unused-includes
#     - unused-variable
  UnusedIncludes: Strict # None

  ClangTidy:
    Remove: [modernize-use-trailing-return-type]

# AutoCompletion
Completion:
  AllScopes: Yes
  HeaderInsertion: Never

# Hover action
Hover:
  ShowAKA: Yes
